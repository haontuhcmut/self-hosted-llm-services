services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: self-hosted-llm-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      - ENV=dev
    restart: unless-stopped

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-b10454@sha256:741a82bf6d1726c82d92693ed9d67d84409a544dacfbb13e787b922555322ae4
    container_name: llama-server
    restart: unless-stopped

    environment:
      LLAMA_PORT: ${LLAMA_PORT:-8080}
      LLAMA_MODEL: ${LLAMA_MODEL}`
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      LLAMA_THREADS: ${LLAMA_THREADS:-8}

    ports:
      - "8080:8080"

    volumes:
      - ./models:/models:ro

    command: >
      --host 0.0.0.0
      --port ${LLAMA_PORT:-8080}
      --model /models/${LLAMA_MODEL}
      --ctx-size ${LLAMA_CTX_SIZE:-4096}
      --threads ${LLAMA_THREADS:-8}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
